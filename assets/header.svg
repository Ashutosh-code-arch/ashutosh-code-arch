<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ashutosh — Software Engineer</title>
  <desc id="desc">Minimal blue and violet developer profile header with a small systems graph.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <style>
      .title { fill:#0F172A; font: 700 44px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill:#64748B; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:1.4px; }
      .subtitle { fill:#475569; font: 400 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node { fill:#FFFFFF; stroke:url(#accent); stroke-width:2; }
      .edge { stroke:#94A3B8; stroke-opacity:.55; stroke-width:2; }
      .code { fill:#64748B; font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-color-scheme: dark) {
        #panel { fill:#111827; stroke:#334155; }
        .title { fill:#F8FAFC; }
        .eyebrow, .subtitle, .code { fill:#94A3B8; }
        .node { fill:#0F172A; }
        .edge { stroke:#475569; }
      }
    </style>
  </defs>

  <rect id="panel" x="18" y="18" width="1164" height="264" rx="26"
        fill="url(#panel)" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="18" y="18" width="7" height="264" rx="3.5" fill="url(#accent)"/>

  <text x="72" y="84" class="eyebrow">ASHUTOSH / SOFTWARE ENGINEER</text>
  <text x="72" y="145" class="title">I build systems that explain themselves.</text>
  <text x="72" y="188" class="subtitle">Developer infrastructure · reliable AI · distributed backends</text>

  <g transform="translate(826 54)">
    <line x1="50" y1="58" x2="146" y2="26" class="edge"/>
    <line x1="50" y1="58" x2="158" y2="112" class="edge"/>
    <line x1="146" y1="26" x2="244" y2="64" class="edge"/>
    <line x1="158" y1="112" x2="244" y2="64" class="edge"/>
    <line x1="158" y1="112" x2="258" y2="154" class="edge"/>

    <circle cx="50" cy="58" r="10" class="node"/>
    <circle cx="146" cy="26" r="10" class="node"/>
    <circle cx="158" cy="112" r="10" class="node"/>
    <circle cx="244" cy="64" r="10" class="node"/>
    <circle cx="258" cy="154" r="10" class="node"/>

    <text x="8" y="196" class="code">failure → evidence → decision</text>
  </g>

  <rect x="72" y="224" width="258" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
